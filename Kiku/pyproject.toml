[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-vtuber"
version = "0.1.0"
description = "Neuro-sama-Klon – Core-Basis (Phase 0)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "structlog>=24.1.0",
  "pydantic-settings>=2.3.4",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1",
  "mss>=9.0.2",
  "pywin32>=306; platform_system == 'Windows'",
  "keyboard>=0.13.5; platform_system == 'Windows'",
  "mouse>=0.7.1; platform_system == 'Windows'",
  "pyautogui>=0.9.54",
  "discord.py>=2.4", # Phase 1: Discord-Bot
  "openai>=1.40.0",
  "pynacl>=1.5.0",
  "httpx>=0.27",
  "discord-ext-voice-recv>=0.4.0",
  "webrtcvad>=2.0.10",
  "torch>=2.3",
  "transformers>=4.42",
  "accelerate>=0.33",
  "datasets>=2.20",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.9",
  "mypy>=1.11.1",
]
observability = [
  "opentelemetry-sdk>=1.27.0",
]

[project.scripts]
bot = "apps.discord_bot.bot:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
